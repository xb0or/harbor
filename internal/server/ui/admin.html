<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand"><svg class="ico" aria-hidden="true"><use href="#i-logo"></use></svg><strong>Harbor</strong></div>
    <h1>管理台登录</h1>
    <p>输入 harbor.yaml 里的 admin token。它只存在当前标签页的 sessionStorage，不会写进 URL 或 Cookie。</p>
    <form id="login-form" novalidate>
      <label class="field"><span>管理 token</span><input id="login-token" class="ctl" type="password" autocomplete="current-password" placeholder="Bearer token" required></label>
      <div class="login-err" id="login-err"></div>
      <button class="btn btn-block" id="login-btn" type="submit">进入管理台</button>
    </form>
  </div>
</div>

      <button type="button" data-tab="keys"><svg class="ico" aria-hidden="true"><use href="#i-key"></use></svg>密钥</button>

      <button type="button" data-tab="models"><svg class="ico" aria-hidden="true"><use href="#i-layers-3"></use></svg>模型</button>
      <button type="button" data-tab="settings"><svg class="ico" aria-hidden="true"><use href="#i-sliders-horizontal"></use></svg>设置</button>
    </nav>
    <div class="rail-foot">
      <a href="/"><svg class="ico" aria-hidden="true"><use href="#i-home"></use></svg>首页</a>
      <button type="button" id="logout"><svg class="ico" aria-hidden="true"><use href="#i-out"></use></svg>退出</button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" id="menu" aria-label="打开导航" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      <h1 id="page-title">概览</h1>
      <div class="spacer" aria-hidden="true"></div>
      <span class="dot" aria-hidden="true"></span>
      <span class="clock" id="clock"></span>
    </header>
    <main class="main" id="main">
      <section class="page" id="tab-overview"></section>
      <section class="page" id="tab-queue" hidden></section>
      <section class="page" id="tab-requests" hidden></section>
      <section class="page" id="tab-keys" hidden></section>
      <section class="page" id="tab-providers" hidden></section>
      <section class="page" id="tab-models" hidden></section>
      <section class="page" id="tab-settings" hidden></section>
    </main>
  </div>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" type="button" id="modal-close" aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x"></use></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot" hidden></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
