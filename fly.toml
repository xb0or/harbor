# Harbor Fly.io 部署配置
# 把 app 改成你自己的 Fly 应用名，区域按需修改（示例：nrt / hkg / sjc）。
# 运行时敏感值一律走 `fly secrets`，不要写进本文件。

app = "harbor-proxy"
primary_region = "nrt"

kill_timeout = 90

[build]
  dockerfile = "Dockerfile"

[env]
  # harbor.yaml 用 ${PORT} 展开监听地址，必须在容器内提供
  PORT = "8080"
  # SQLite 落在持久卷上，重启/部署不丢审计与凭证密文
  HARBOR_DB_PATH = "/data/harbor.db"
  HARBOR_KEY_PATH = "/data/harbor.key"

[mounts]
  source = "harbor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # AI 网关需要常驻：排队中的请求不能被停机打断
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # SSE 长连接按请求计数，阈值放宽避免误判过载
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
