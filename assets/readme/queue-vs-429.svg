<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-labelledby="qvTitle qvDesc">
  <title id="qvTitle">同一个请求，两种网关</title>
  <desc id="qvDesc">A：网关立刻返回 429，客户端自己退避重试。B：Harbor 让请求排队 8.4 秒，期间每 15 秒一次 SSE 注释心跳，拿到泊位后返回 200。</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Cascadia Mono", monospace; }
      .ink { fill: #12161C; }
      .navy { fill: #14304A; }
      .body { fill: #4A525C; }
      .muted { fill: #7C838D; }
      .signal { fill: #E2673B; }
      .fail { fill: #A33B2A; }
      .rule { stroke: #12161C; stroke-opacity: .12; stroke-width: 1; }
      .axis { stroke: #12161C; stroke-opacity: .32; stroke-width: 1.2; }
      .ghost { stroke: #12161C; stroke-opacity: .3; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
      .hold { stroke: #E2673B; stroke-width: 2; stroke-dasharray: 8 5; fill: none; }
      .evbox { fill: #FFFFFF; stroke: #12161C; stroke-opacity: .18; stroke-width: 1.2; }
    </style>
    <marker id="qvArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12161C" fill-opacity=".45"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#F7F6F3"/>
  <rect x=".5" y=".5" width="1199" height="519" rx="10" fill="none" stroke="#12161C" stroke-opacity=".12"/>

  <text class="mono navy" x="64" y="60" font-size="18" letter-spacing="2.4">SAME REQUEST · TWO GATEWAYS</text>
  <text class="mono muted" x="1136" y="60" font-size="16" text-anchor="end">时间轴为示意，非基准测试</text>
  <line class="rule" x1="64" y1="84" x2="1136" y2="84"/>

  <!-- A：立刻 429 -->
  <text class="sans ink" x="64" y="128" font-size="22" font-weight="600">A · 立刻返回 429</text>
  <line class="axis" x1="300" y1="212" x2="1100" y2="212"/>
  <line class="axis" x1="300" y1="206" x2="300" y2="218"/>
  <line class="axis" x1="460" y1="206" x2="460" y2="218"/>
  <line class="axis" x1="620" y1="206" x2="620" y2="218"/>
  <line class="axis" x1="780" y1="206" x2="780" y2="218"/>
  <line class="axis" x1="940" y1="206" x2="940" y2="218"/>
  <line class="axis" x1="1100" y1="206" x2="1100" y2="218"/>
  <text class="mono muted" x="300" y="236" font-size="16" text-anchor="middle">0s</text>
  <text class="mono muted" x="460" y="236" font-size="16" text-anchor="middle">2s</text>
  <text class="mono muted" x="620" y="236" font-size="16" text-anchor="middle">4s</text>
  <text class="mono muted" x="780" y="236" font-size="16" text-anchor="middle">6s</text>
  <text class="mono muted" x="940" y="236" font-size="16" text-anchor="middle">8s</text>
  <text class="mono muted" x="1100" y="236" font-size="16" text-anchor="middle">10s</text>

  <rect class="evbox" x="300" y="154" width="118" height="40" rx="7"/>
  <text class="sans ink" x="359" y="179" font-size="17" text-anchor="middle">请求到达</text>
  <line class="ghost" x1="418" y1="174" x2="462" y2="174"/>
  <text class="mono fail" x="470" y="182" font-size="24" font-weight="700">429</text>
  <text class="mono muted" x="470" y="204" font-size="16">Retry-After: 12s</text>
  <line class="ghost" x1="600" y1="174" x2="1100" y2="174"/>
  <text class="sans body" x="612" y="150" font-size="17">客户端自己退避、自己重排，用户多等一轮</text>

  <line class="rule" x1="64" y1="266" x2="1136" y2="266"/>

  <!-- B：Harbor 排队 -->
  <text class="sans ink" x="64" y="306" font-size="22" font-weight="600">B · Harbor：先排队，再回 200</text>
  <line class="axis" x1="300" y1="392" x2="1100" y2="392"/>
  <line class="axis" x1="300" y1="386" x2="300" y2="398"/>
  <line class="axis" x1="460" y1="386" x2="460" y2="398"/>
  <line class="axis" x1="620" y1="386" x2="620" y2="398"/>
  <line class="axis" x1="780" y1="386" x2="780" y2="398"/>
  <line class="axis" x1="940" y1="386" x2="940" y2="398"/>
  <line class="axis" x1="1100" y1="386" x2="1100" y2="398"/>
  <text class="mono muted" x="300" y="416" font-size="16" text-anchor="middle">0s</text>
  <text class="mono muted" x="460" y="416" font-size="16" text-anchor="middle">2s</text>
  <text class="mono muted" x="620" y="416" font-size="16" text-anchor="middle">4s</text>
  <text class="mono muted" x="780" y="416" font-size="16" text-anchor="middle">6s</text>
  <text class="mono muted" x="940" y="416" font-size="16" text-anchor="middle">8s</text>
  <text class="mono muted" x="1100" y="416" font-size="16" text-anchor="middle">10s</text>

  <rect class="evbox" x="300" y="334" width="118" height="40" rx="7"/>
  <text class="sans ink" x="359" y="359" font-size="17" text-anchor="middle">请求入队</text>
  <line class="hold" x1="418" y1="354" x2="900" y2="354"/>
  <text class="mono signal" x="430" y="344" font-size="17">排队 8.4s · X-Queue-Position: 3</text>
  <text class="mono muted" x="430" y="380" font-size="16">每 15s 一次 SSE 注释心跳，连接不断开</text>

  <rect class="evbox" x="900" y="334" width="120" height="40" rx="7"/>
  <text class="sans ink" x="960" y="359" font-size="17" text-anchor="middle">获得泊位</text>
  <line x1="1022" y1="354" x2="1052" y2="354" stroke="#12161C" stroke-opacity=".4" stroke-width="1.4" marker-end="url(#qvArrow)"/>
  <circle cx="1064" cy="354" r="5" fill="#14304A"/>
  <text class="mono navy" x="1064" y="334" font-size="18" text-anchor="middle">200 OK</text>

  <text class="sans body" x="64" y="470" font-size="18">超过 queue.max_wait 或队列已满，Harbor 仍会收敛成一个带 Retry-After 的 429 —— 排队不等于无限等。</text>
</svg>
